<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Product Finder</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e2dd; --accent:#2f6fde; --good:#1f8a4c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --card:#1f1f1d; --ink:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7aa6ff; --good:#5fcf8f; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  h1 { margin:0 0 4px; font-size:24px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 320px; padding:11px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font-size:15px; }
  button { padding:11px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-size:14px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .examples { margin:10px 0 18px; display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { padding:4px 10px; font-size:13px; border-radius:999px; color:var(--muted); }
  .answer { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; white-space:pre-wrap; margin-bottom:18px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
  .col { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; min-width:0; }
  .col h3 { margin:0 0 8px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .item { padding:8px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; }
  .name { font-weight:600; }
  .small { color:var(--muted); font-size:12.5px; }
  .empty { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<main>
  <h1>Smart Product Finder</h1>
  <p class="sub">Describe what you need in your own words. Try a price limit too, like "under 1500".</p>

  <form id="f">
    <input id="q" type="text" placeholder="e.g. something to keep my coffee hot on the drive to work" autofocus>
    <button class="primary" type="submit" data-action="ask">Ask (RAG)</button>
    <button type="button" id="cmp">Compare search methods</button>
  </form>
  <div class="examples" id="ex"></div>

  <div id="out"></div>
</main>
<script>
const EXAMPLES = [
  "something to keep my coffee hot on the drive to work",
  "my wrist hurts after using the computer all day",
  "music at the pool party, it might get splashed",
  "wireless earbuds under 2000",
  "partner snores and I cannot fall asleep",
  "yoga mat",
];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const price = (p) => p >= 0 ? "₹" + Math.round(p).toLocaleString("en-IN") : "price n/a";

for (const e of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = e;
  b.onclick = () => { $("#q").value = e; ask(); };
  $("#ex").appendChild(b);
}

function itemHtml(h) {
  return `<div class="item"><div class="name">${esc(h.name)}</div>
    <div class="small">${price(h.price)} · ${esc(h.category || "")} · score ${h.score}</div></div>`;
}

async function ask() {
  const q = $("#q").value.trim(); if (!q) return;
  $("#out").innerHTML = '<p class="meta">Thinking…</p>';
  try {
    const r = await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question:q})});
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    $("#out").innerHTML = `<div class="meta">LLM: ${esc(d.llm)} · ${d.ms} ms</div>
      <div class="answer">${esc(d.answer)}</div>
      <div class="col"><h3>Retrieved from the vector DB</h3>${d.sources.map(itemHtml).join("") || '<p class="empty">nothing</p>'}</div>`;
  } catch (e) { $("#out").innerHTML = `<p class="empty">Error: ${esc(e.message)}</p>`; }
}

async function compare() {
  const q = $("#q").value.trim(); if (!q) return;
  $("#out").innerHTML = '<p class="meta">Searching…</p>';
  const r = await fetch("/api/compare?q=" + encodeURIComponent(q));
  const d = await r.json();
  const label = {keyword:"Naive keyword", bm25:"BM25", semantic:"Semantic (vector DB)", hybrid:"Hybrid (RRF)"};
  $("#out").innerHTML = '<div class="grid">' + Object.entries(d).map(([m, hits]) =>
    `<div class="col"><h3>${label[m]}</h3>${hits.map(itemHtml).join("") || '<p class="empty">no results</p>'}</div>`).join("") + "</div>";
}

$("#f").onsubmit = (e) => { e.preventDefault(); ask(); };
$("#cmp").onclick = compare;
</script>
</body>
</html>
